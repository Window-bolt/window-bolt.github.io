<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TEAM HYDRO</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="loginBox">
    <h1>TEAM <span>HYDRO</span></h1>
    <input id="user" placeholder="Username">
    <input id="pass" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <button class="secondary" onclick="signup()">Sign Up</button>
  </div>
</div>

<!-- APP -->
<div id="app">
<header>
  <h2>TEAM HYDRO</h2>
  <button onclick="logout()">Logout</button>
</header>

<div class="grid">

<div class="card">
  <h3>🔥 Live Fire Map</h3>
  <div id="map"></div>
  <button onclick="toggleFires()">Toggle Fire Layer</button>
</div>

<div class="card">
  <h3>🔥 Fire Game</h3>
  <p id="fireInfo">Score: 0 | Best: 0 | Time: 10</p>
  <div id="fireArea"></div>
  <button onclick="startFireGame()">Start</button>
  <p id="fireResult"></p>
</div>

<div class="card">
  <h3>💧 Flappy Bird</h3>
  <p id="flappyInfo">Score: 0 | Best: 0</p>
  <canvas id="game" width="300" height="360"></canvas>
  <button onclick="startFlappy()">Play</button>
</div>

<div class="card">
  <h3>📜 Credits</h3>
  <p>Project Hydro X</p>
  <p>Designed & Developed by Team Hydro 
  Gangan R G
</p>
</div>

</div>
</div>

<script src="script.js"></script>
</body>
</html>
